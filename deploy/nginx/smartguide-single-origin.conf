# SmartGuide Single-Origin HTTPS + WSS Nginx Configuration (B04)
#
# Topology:
#   https://app.smartguide.uz/                 -> Next.js Tourist PWA (127.0.0.1:3000)
#   https://app.smartguide.uz/api/explore/live -> Express Gemini Live WebSocket (127.0.0.1:4000, Upgrade + 660s)
#   https://app.smartguide.uz/api/*            -> Express API (127.0.0.1:4000, same-origin cookies & zero CORS overhead)
#   https://admin.smartguide.uz/               -> B2B Dashboard static bundle (127.0.0.1:5173)
#   https://admin.smartguide.uz/api/*          -> Express API (127.0.0.1:4000)
#
# Required server .env settings when using this proxy:
#   NODE_ENV=production
#   LANDMARK_STORE=postgres
#   AUTO_SEED=false
#   TRUST_PROXY=loopback
#   CORS_ORIGIN=https://app.smartguide.uz,https://admin.smartguide.uz
#   NEXT_PUBLIC_API_URL=https://app.smartguide.uz
#   SMARTGUIDE_API_ORIGIN=http://127.0.0.1:4000
#   VITE_API_URL=https://admin.smartguide.uz
#   VITE_TOURIST_APP_URL=https://app.smartguide.uz
#   AUTH_STORE_FILE=/var/lib/smartguide/auth/accounts.json
#   ACCESS_STORE_FILE=/var/lib/smartguide/auth/access.json

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Redirect HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name app.smartguide.uz admin.smartguide.uz;
    return 301 https://$host$request_uri;
}

# --- Main Tourist PWA + Same-Origin API & Live WSS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.smartguide.uz;

    # Managed by Certbot (sudo certbot --nginx -d app.smartguide.uz -d admin.smartguide.uz)
    ssl_certificate     /etc/letsencrypt/live/app.smartguide.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.smartguide.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    # Gemini Live bidirectional audio/photo WebSocket (10-minute session cap)
    location = /api/explore/live {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    # REST API (same-origin so HttpOnly auth/trial cookies work on Safari & Android Chrome)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Next.js Tourist PWA
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- B2B Museum Analytics Dashboard ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.smartguide.uz;

    ssl_certificate     /etc/letsencrypt/live/app.smartguide.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.smartguide.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
